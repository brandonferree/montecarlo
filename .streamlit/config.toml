[theme]
# Becker Capital Management — Official Brand (dark)
# Sourced from BCM brand guidelines (anthropic-skills:bcm-branding).
base = "dark"

# Midnight — the official BCM dark background
backgroundColor = "#0C2331"

# Slightly lighter Midnight tint for the sidebar so it reads as a distinct
# panel. (Not an officially named brand color — derived from Midnight for
# necessary UI contrast against the main bg.)
secondaryBackgroundColor = "#1A3548"

# Canyon — official tertiary accent (orange/copper). Drives sliders, primary
# buttons, links, focus rings.
primaryColor = "#AD5E25"

# Light Grey — official BCM body text color on dark backgrounds
textColor = "#EEEEED"

# Sans-serif throughout. BCM brand specifies Montserrat for headings and
# Lora for body, but those need to be loaded; Streamlit's generic sans-
# serif is a safe fallback until those fonts are wired in.
font = "sans serif"
